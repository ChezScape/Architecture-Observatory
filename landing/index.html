<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Architecture Observatory</title>

<style>
body {
    margin: 0;
    font-family: system-ui;
    background: radial-gradient(circle at 20% 20%, #0b1430, #05060a);
    color: #d7e1ff;
    overflow: hidden;
}

.grid {
    position: absolute;
    inset: 0;
    background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 42px 42px;
    animation: move 20s linear infinite;
    opacity: 0.4;
}

@keyframes move {
    from { transform: translate(0,0); }
    to { transform: translate(40px,40px); }
}

.hero {
    position: relative;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.title {
    font-size: 44px;
    font-weight: 800;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 10px #5eead4; }
    to { text-shadow: 0 0 25px #60a5fa; }
}

.subtitle {
    max-width: 600px;
    opacity: 0.7;
    margin-top: 10px;
}

button {
    margin-top: 25px;
    padding: 12px 18px;
    border: 1px solid #5eead4;
    background: transparent;
    color: #5eead4;
    border-radius: 10px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="grid"></div>

<div class="hero">
    <div class="title">Architecture Observatory</div>

    <div class="subtitle">
        A runtime intelligence system that observes, simulates, and explains software behaviour in real time.
    </div>

    <button onclick="location.href='../index.html'">
        Enter System
    </button>
</div>

</body>
</html>
